name: New AI app or MCP server
description: Ask us to recognise an AI tool or MCP server that shows up as "unknown"
labels: [profile]
body:
  - type: input
    id: app
    attributes:
      label: AI app / tool
      placeholder: e.g. Zed, Cline, Continue, Aider
    validations:
      required: true
  - type: textarea
    id: processes
    attributes:
      label: Process names and command lines
      description: Output of the PowerShell snippet in docs/adding-an-agent.md. Remove usernames and tokens.
      render: text
    validations:
      required: true
  - type: textarea
    id: scan
    attributes:
      label: "`airg scan` output (optional)"
      render: text
