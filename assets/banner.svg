<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="AI RAM Guard: stop AI agents and MCP servers from eating your RAM">
  <defs>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#ba01c4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ba01c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d21be0"/><stop offset="0.55" stop-color="#ba01c4"/><stop offset="1" stop-color="#5b0aa8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="24" fill="#0e0a16"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>

  <!-- logo tile -->
  <g transform="translate(80 90) scale(0.47)">
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="44"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-dasharray="660 943" transform="rotate(-90 256 256)"/>
    <rect x="196" y="206" width="120" height="100" rx="18" fill="#fff"/>
    <g fill="#fff">
      <rect x="212" y="306" width="14" height="22" rx="4"/><rect x="238" y="306" width="14" height="22" rx="4"/><rect x="264" y="306" width="14" height="22" rx="4"/><rect x="290" y="306" width="14" height="22" rx="4"/>
      <rect x="212" y="184" width="14" height="22" rx="4"/><rect x="238" y="184" width="14" height="22" rx="4"/><rect x="264" y="184" width="14" height="22" rx="4"/><rect x="290" y="184" width="14" height="22" rx="4"/>
    </g>
    <text x="256" y="272" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="800" font-size="46" fill="#ba01c4">AI</text>
  </g>

  <g font-family="Segoe UI, Inter, -apple-system, Arial, sans-serif">
    <text x="360" y="170" font-size="72" font-weight="800" fill="#ffffff">AI RAM Guard</text>
    <text x="362" y="222" font-size="28" fill="#e9d5ff">Stop AI agents and MCP servers from eating your RAM.</text>
    <text x="362" y="258" font-size="22" fill="#a78bba">Finds duplicate and orphaned MCP servers · frees memory for games · tiny tray app</text>

    <g font-size="18" font-weight="600" fill="#ffffff">
      <rect x="362" y="296" width="132" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ba01c4"/><text x="428" y="321" text-anchor="middle">Claude Code</text>
      <rect x="506" y="296" width="96" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ba01c4"/><text x="554" y="321" text-anchor="middle">Codex</text>
      <rect x="614" y="296" width="96" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ba01c4"/><text x="662" y="321" text-anchor="middle">Cursor</text>
      <rect x="722" y="296" width="118" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ba01c4"/><text x="781" y="321" text-anchor="middle">Windsurf</text>
      <rect x="852" y="296" width="130" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ba01c4"/><text x="917" y="321" text-anchor="middle">Gemini CLI</text>
      <rect x="994" y="296" width="132" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ba01c4"/><text x="1060" y="321" text-anchor="middle">MCP servers</text>
    </g>
    <text x="362" y="380" font-size="16" fill="#7c6a8a">Open source by Magnus Steinmeier Olsen · Byens IT</text>
  </g>
</svg>
